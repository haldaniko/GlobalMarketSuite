name: globalmarketsuite

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env.production
    volumes:
      - globalmarketsuite_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  import-legacy-data:
    image: globalmarketsuite-backend-prod
    build:
      context: ./backend
      target: prod
    command: node scripts/import-postgres.mjs
    restart: "no"
    volumes:
      - ./:/host-data
      - globalmarketsuite_prod_uploads:/legacy-uploads:ro
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: migration
      HOST_DATA_DIR: /host-data
      LEGACY_UPLOAD_DIR: /legacy-uploads
      PGHOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: globalmarketsuite-backend-prod
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports:
      - "4100:4000"
    volumes:
      - ./:/host-data
    env_file:
      - path: backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_PATH: /host-data/db.sqlite3
      UPLOAD_DIR: /host-data/media
      REDIS_URL: redis://redis:6379
    depends_on:
      import-legacy-data:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: globalmarketsuite-frontend-prod
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "8095:3000"
    volumes:
      - ./media/covers:/app/dist/covers:ro
      - ./media:/app/dist/uploads:ro
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

volumes:
  globalmarketsuite_prod_postgres_data:
    external: true
    name: globalmarketsuite_globalmarketsuite_prod_postgres_data
  globalmarketsuite_prod_uploads:
    external: true
    name: globalmarketsuite_globalmarketsuite_prod_uploads

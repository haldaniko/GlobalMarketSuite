services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: globalmarketsuite-backend-dev
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - ./:/host-data
      - ./private:/app/private:ro
    env_file:
      - ./.env
    environment:
      DATABASE_PATH: /host-data/db.sqlite3
      UPLOAD_DIR: /host-data/media
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:9005
      CORS_ALLOWED_ORIGINS: http://localhost:9005,http://127.0.0.1:9005
      SITE_URL: http://localhost:9005
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: globalmarketsuite-frontend-dev
    build:
      context: ./frontend
      target: dev
    ports:
      - "9005:3000"
    env_file:
      - ./.env
    environment:
      VITE_API_URL: http://localhost:4000
      BACKEND_PROXY_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

  admin-seed:
    image: globalmarketsuite-backend-dev
    volumes:
      - ./:/host-data
    env_file:
      - ./.env
    environment:
      DATABASE_PATH: /host-data/db.sqlite3
      LOCAL_SUPERADMIN_EMAIL: ${LOCAL_SUPERADMIN_EMAIL:-admin@globalmarketsuite.local}
      LOCAL_SUPERADMIN_PASSWORD: ${LOCAL_SUPERADMIN_PASSWORD:-MySecretPassword123!}
    command: npm run create-superadmin
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
